name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: pip install -c requirements.txt '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest -m 'not integration'

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGENTIC_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agentic_test
      LANGGRAPH_STRICT_MSGPACK: 'true'      
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: pip install -c requirements.txt '.[dev]'
      - name: Integration tests
        run: pytest -m integration

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentic
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t agentic-ops:ci .
      - name: Smoke test
        env:
          AGENTIC_DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:5432/agentic
        run: |
          docker run -d --name app -p 8000:8000 \
            --add-host=host.docker.internal:host-gateway \
            -e AGENTIC_DATABASE_URL \
            agentic-ops:ci
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect -f "{{.State.Running}}" app)" != "true" ]; then
              echo "container exited early"
              exit 1
            fi
            if curl -fsS --max-time 2 http://localhost:8000/ready; then
              curl -fsS --max-time 2 http://localhost:8000/health
              exit 0
            fi
            sleep 2
          done
          echo "readiness timeout"
          exit 1
      - name: Container logs
        if: failure()
        run: docker logs app